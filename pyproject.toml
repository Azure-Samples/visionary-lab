[project]
name = "visionary-lab"
version = "0.1.0"
description = "Create and manage creative content"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.9.0",
    "azure-identity>=1.21.0",
    "azure-storage-blob>=12.25.1",
    "azure-storage-queue>=12.12.0",
    "fastapi[standard]>=0.115.12",
    "httpx>=0.27.0",
    "ipykernel>=6.29.5",
    "openai>=3.2.0",
    "pillow>=11.1.0",
    "pydantic-settings>=2.8.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.26.0",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.34.0",
    "azure-cosmos==4.9.0"
]


[tool.pytest.ini_options]
addopts = "-m 'not integration'"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "integration: tests that call real Azure APIs (use -m integration to run)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
