services:
  backend:
    build:
      context: .  # Set to root folder where pyproject.toml is located
      dockerfile: backend/Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=0  # Disable build cache
    ports:
      - "8000:80"
    volumes:
      - ./backend/static:/app/static
    environment:
      # Azure AI Foundry via DefaultAzureCredential.
      - MODEL_PROVIDER=${MODEL_PROVIDER:-azure}
      - AI_FOUNDRY_ENDPOINT=${AI_FOUNDRY_ENDPOINT}
      - LLM_DEPLOYMENT=${LLM_DEPLOYMENT:-gpt-4o}
      - IMAGEGEN_2_DEPLOYMENT=${IMAGEGEN_2_DEPLOYMENT:-gpt-image-2}
      - FLUX_KONTEXT_DEPLOYMENT=${FLUX_KONTEXT_DEPLOYMENT:-flux-kontext-pro}

      # Standard Azure Identity environment credentials for local containers.
      # Pass through only variables that are actually set on the host. Empty
      # EnvironmentCredential triples prevent DefaultAzureCredential fallback.
      - AZURE_CLIENT_ID
      - AZURE_TENANT_ID
      - AZURE_CLIENT_SECRET

      # Azure Blob Storage, Queue, and Cosmos DB via the same credential.
      - AZURE_BLOB_SERVICE_URL=${AZURE_BLOB_SERVICE_URL}
      - AZURE_STORAGE_ACCOUNT_NAME=${AZURE_STORAGE_ACCOUNT_NAME}
      - AZURE_BLOB_IMAGE_CONTAINER=${AZURE_BLOB_IMAGE_CONTAINER:-images}
      - AZURE_STORAGE_QUEUE_URL=${AZURE_STORAGE_QUEUE_URL:-}
      - AZURE_STORAGE_QUEUE_NAME=${AZURE_STORAGE_QUEUE_NAME:-image-generation-jobs}
      - AZURE_STORAGE_POISON_QUEUE_NAME=${AZURE_STORAGE_POISON_QUEUE_NAME:-image-generation-jobs-poison}
      - AZURE_COSMOS_DB_ENDPOINT=${AZURE_COSMOS_DB_ENDPOINT:-}
      - AZURE_COSMOS_DB_ID=${AZURE_COSMOS_DB_ID:-VisionaryLabDB}
      - AZURE_COSMOS_CONTAINER_ID=${AZURE_COSMOS_CONTAINER_ID:-visionarylab}
      - IMAGE_JOB_MODE=${IMAGE_JOB_MODE:-memory}
      - IMAGE_JOB_ROLE=all
      - IMAGE_JOB_CONCURRENCY=${IMAGE_JOB_CONCURRENCY:-2}

      - AOAI_API_VERSION=${AOAI_API_VERSION:-2025-04-01-preview}
      - PYTHONPATH=/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - BACKEND_API_URL=http://backend:80
      - NEXT_PUBLIC_API_PROTOCOL=http
      - NEXT_PUBLIC_API_HOSTNAME=backend
      - NEXT_PUBLIC_API_PORT=80
      - NEXT_PUBLIC_STORAGE_ACCOUNT_NAME=${AZURE_STORAGE_ACCOUNT_NAME}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: ai-content-lab-network
    driver: bridge
