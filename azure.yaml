# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: visionary-lab
metadata:
  template: visionary-lab@0.0.1-beta
services:
  backend:
    project: .
    language: python
    host: containerapp
    docker:
      path: ./backend/Dockerfile
      context: .
    hooks:
      postdeploy:
        posix:
          shell: sh
          interactive: false
          continueOnError: false
          run: |
            set -eu

            resource_group=$(azd env get-value AZURE_RESOURCE_GROUP)
            backend_app=$(azd env get-value BACKEND_CONTAINER_APP_NAME)
            worker_app=$(azd env get-value IMAGE_WORKER_CONTAINER_APP_NAME)

            backend_image=$(az containerapp show \
              --resource-group "$resource_group" \
              --name "$backend_app" \
              --query 'properties.template.containers[0].image' \
              --output tsv \
              --only-show-errors)
            worker_image=$(az containerapp show \
              --resource-group "$resource_group" \
              --name "$worker_app" \
              --query 'properties.template.containers[0].image' \
              --output tsv \
              --only-show-errors)

            if [ -z "$backend_image" ]; then
              echo "Backend deployment did not expose a container image." >&2
              exit 1
            fi

            if [ "$worker_image" = "$backend_image" ]; then
              echo "Image worker already uses backend image $backend_image"
              exit 0
            fi

            echo "Updating $worker_app to backend image $backend_image"
            az containerapp update \
              --resource-group "$resource_group" \
              --name "$worker_app" \
              --container-name "$worker_app" \
              --image "$backend_image" \
              --output none \
              --only-show-errors

            synchronized_image=$(az containerapp show \
              --resource-group "$resource_group" \
              --name "$worker_app" \
              --query 'properties.template.containers[0].image' \
              --output tsv \
              --only-show-errors)
            if [ "$synchronized_image" != "$backend_image" ]; then
              echo "Worker image synchronization did not converge." >&2
              exit 1
            fi
        windows:
          shell: pwsh
          interactive: false
          continueOnError: false
          run: |
            $ErrorActionPreference = 'Stop'

            $resourceGroup = azd env get-value AZURE_RESOURCE_GROUP
            $backendApp = azd env get-value BACKEND_CONTAINER_APP_NAME
            $workerApp = azd env get-value IMAGE_WORKER_CONTAINER_APP_NAME

            $backendImage = az containerapp show `
              --resource-group $resourceGroup `
              --name $backendApp `
              --query 'properties.template.containers[0].image' `
              --output tsv `
              --only-show-errors
            if ($LASTEXITCODE -ne 0 -or -not $backendImage) {
              throw 'Backend deployment did not expose a container image.'
            }

            $workerImage = az containerapp show `
              --resource-group $resourceGroup `
              --name $workerApp `
              --query 'properties.template.containers[0].image' `
              --output tsv `
              --only-show-errors
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to inspect image worker $workerApp."
            }

            if ($workerImage -eq $backendImage) {
              Write-Host "Image worker already uses backend image $backendImage"
              exit 0
            }

            Write-Host "Updating $workerApp to backend image $backendImage"
            az containerapp update `
              --resource-group $resourceGroup `
              --name $workerApp `
              --container-name $workerApp `
              --image $backendImage `
              --output none `
              --only-show-errors
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to update image worker $workerApp."
            }

            $synchronizedImage = az containerapp show `
              --resource-group $resourceGroup `
              --name $workerApp `
              --query 'properties.template.containers[0].image' `
              --output tsv `
              --only-show-errors
            if ($LASTEXITCODE -ne 0 -or $synchronizedImage -ne $backendImage) {
              throw 'Worker image synchronization did not converge.'
            }
  frontend:
    project: ./frontend
    language: js
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .

hooks:
  postprovision:
    posix:
      shell: sh
      run: |
        echo "Infrastructure provisioned successfully"
        echo "Approving Front Door private link connection to storage account..."
        STORAGE_NAME=$(azd env get-value AZURE_STORAGE_ACCOUNT_NAME 2>/dev/null || echo "")
        if [ -n "$STORAGE_NAME" ]; then
          PE_CONN_ID=$(az storage account show --name "$STORAGE_NAME" --query "privateEndpointConnections[?privateLinkServiceConnectionState.status=='Pending'].id" -o tsv 2>/dev/null | head -1)
          if [ -n "$PE_CONN_ID" ]; then
            az network private-endpoint-connection approve --id "$PE_CONN_ID" --description "Approved by azd postprovision" 2>/dev/null && echo "Private link connection approved." || echo "Warning: Could not auto-approve private link. Approve manually in Azure Portal."
          else
            echo "No pending private link connections found (may already be approved)."
          fi
        fi
    windows:
      shell: pwsh
      run: |
        Write-Host "Infrastructure provisioned successfully"
        Write-Host "Approving Front Door private link connection to storage account..."
        $storageName = azd env get-value AZURE_STORAGE_ACCOUNT_NAME 2>$null
        if ($storageName) {
          $peConnId = az storage account show --name $storageName --query "privateEndpointConnections[?privateLinkServiceConnectionState.status=='Pending'].id" -o tsv 2>$null | Select-Object -First 1
          if ($peConnId) {
            az network private-endpoint-connection approve --id $peConnId --description "Approved by azd postprovision" 2>$null
            if ($LASTEXITCODE -eq 0) { Write-Host "Private link connection approved." } else { Write-Host "Warning: Could not auto-approve private link. Approve manually in Azure Portal." }
          } else {
            Write-Host "No pending private link connections found (may already be approved)."
          }
        }

infra:
  provider: bicep
  path: infra

pipeline:
  provider: github
